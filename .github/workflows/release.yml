name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    # Nothing used to run tests on the tagged commit, so a tag pushed past
    # a red CI (or onto a commit CI never saw) still shipped. Every build
    # below needs this job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the version in every file
        # A mismatched tag would publish under the wrong version, and
        # Cloudsmith's --republish would silently overwrite an existing
        # release's packages.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          FALLBACK=$(grep -oP '__version__ = "\K[^"]+' src/polyglot_ai/__init__.py)
          METAINFO=$(grep -oP '<release version="\K[^"]+' packaging/flatpak/io.github.sabiut.polyglotai.metainfo.xml | head -1)
          echo "tag=$TAG pyproject=$PYPROJECT fallback=$FALLBACK metainfo=$METAINFO"
          for v in "$PYPROJECT" "$FALLBACK" "$METAINFO"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::Tag v$TAG doesn't match version $v — bump pyproject.toml, src/polyglot_ai/__init__.py and the metainfo release entry together."
              exit 1
            fi
          done

      - name: Install Qt system dependencies
        timeout-minutes: 5
        run: |
          .github/scripts/apt-install.sh \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse0 libxslt1.1

      - name: Install dependencies (tested set)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q -p no:cacheprovider

  build-wheel:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  build-deb:
    needs: build-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        timeout-minutes: 5
        run: .github/scripts/apt-install.sh dpkg-dev
      - name: Build .deb
        run: bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/*.deb

  build-rpm:
    needs: build-wheel
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: dnf install -y rpm-build python3 python3-pip python3-devel
      - name: Build .rpm
        run: bash packaging/build_rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: packaging/*.rpm

  build-appimage:
    needs: build-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # The Qt libraries are for build_appimage.sh's smoke test, which
        # imports PyQt6 with the bundled interpreter before packaging.
        timeout-minutes: 5
        run: |
          .github/scripts/apt-install.sh libfuse2 wget \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaging/*.AppImage

  create-release:
    needs: [build-deb, build-rpm, build-appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Prepend install instructions so users hit
          # "what do I do with these files?" above the auto-generated
          # changelog. ``softprops/action-gh-release`` puts ``body``
          # before the generated notes by default.
          body: |
            ### Install

            See **[packaging/INSTALL.md](https://github.com/sabiut/polyglot-ai/blob/main/packaging/INSTALL.md)**
            for the full distro-specific guide.

            Quick start:

            - **Debian/Ubuntu**:  `sudo apt install ./polyglot-ai_*_amd64.deb`
            - **Fedora/RHEL**:    `sudo dnf install ./polyglot-ai-*.rpm`
            - **Any Linux**:      `chmod +x Polyglot_AI-*.AppImage && ./Polyglot_AI-*.AppImage`

            > **AppImage** on Ubuntu 22.04+ / Fedora 36+ needs
            > `libfuse2` (or `fuse-libs` on Fedora). See INSTALL.md
            > if double-clicking does nothing.

            All three packages bundle their Python dependencies, so
            no PyPI access is needed at install time.
          files: |
            artifacts/wheel/*.whl
            artifacts/deb/*.deb
            artifacts/rpm/*.rpm
            artifacts/appimage/*.AppImage

  publish-repos:
    # Push the built .deb/.rpm into hosted Cloudsmith repositories so
    # installed users receive updates through plain `apt upgrade` /
    # `dnf upgrade` instead of manual downloads.
    #
    # Soft-gated: until the CLOUDSMITH_API_KEY repository secret is
    # configured (see packaging/APT-REPO.md) this job logs a notice
    # and exits green, so forks and pre-setup releases don't fail.
    needs: create-release
    runs-on: ubuntu-24.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO || 'opensource-r6tx/polyglot-ai' }}
    steps:
      - name: Check for Cloudsmith credentials
        id: creds
        run: |
          if [ -n "$CLOUDSMITH_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDSMITH_API_KEY secret not set — skipping APT/RPM repo publish. Setup guide: packaging/APT-REPO.md"
          fi

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.have == 'true'
        with:
          path: artifacts/

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.have == 'true'
        with:
          python-version: "3.11"

      - name: Install Cloudsmith CLI
        if: steps.creds.outputs.have == 'true'
        run: pip install --upgrade cloudsmith-cli

      - name: Publish .deb to the APT repository
        if: steps.creds.outputs.have == 'true'
        run: |
          set -euo pipefail
          DEB=$(ls artifacts/deb/*.deb)
          # One push per supported distro/release. The same binary
          # serves them all (it bundles its own Python deps); the
          # per-distro targets just make `apt` metadata resolve for
          # each user's sources entry.
          for target in debian/trixie debian/bookworm ubuntu/noble ubuntu/jammy; do
            cloudsmith push deb "$CLOUDSMITH_REPO/$target" "$DEB" --republish
          done

      - name: Publish .rpm to the RPM repository
        if: steps.creds.outputs.have == 'true'
        run: |
          set -euo pipefail
          RPM=$(ls artifacts/rpm/*.rpm)
          for target in fedora/44 fedora/43; do
            cloudsmith push rpm "$CLOUDSMITH_REPO/$target" "$RPM" --republish
          done

  publish-pypi:
    # Publish the wheel to PyPI so `pipx install polyglot-ai` works
    # without downloading release assets. Uses PyPI trusted publishing
    # (OIDC) — no token or secret anywhere.
    #
    # Gated on the PYPI_PUBLISH_ENABLED repository variable: flip it
    # to "true" after registering the trusted publisher on pypi.org
    # (see packaging/PYPI.md). Until then the job is skipped entirely.
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    # After the GitHub Release exists, i.e. after every package built.
    # It used to need only build-wheel, so PyPI could publish a version
    # whose deb/rpm/AppImage builds had failed.
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

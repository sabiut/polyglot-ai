name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runners are pinned to ubuntu-24.04 here and in release.yml.
# ``ubuntu-latest`` started resolving to ubuntu-26.04 in November 2026;
# the tests and the release packages have only ever been built on 24.04,
# so move to a newer image deliberately, in a change of its own.
jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies
        # A mirror outage should fail in minutes, not hold the job. The
        # script skips apt entirely when the image already has the libs.
        timeout-minutes: 5
        # libpulse0 + libxslt1.1 are pulled in for QtMultimedia /
        # QtWebEngine respectively — without them the module-level
        # imports in video_preview.py would short-circuit to the
        # "no preview available" stub on CI and the multimedia
        # tests would be skipped silently. Installing the libs
        # lets CI exercise the full feature surface that ships in
        # the .deb / .rpm / AppImage releases.
        run: |
          .github/scripts/apt-install.sh \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse0 libxslt1.1

      - name: Install dependencies
        run: |
          pip install -c constraints.txt -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -x -q

  # macOS / Windows aren't supported platforms yet. These runs are
  # informational (continue-on-error) so they can't block a merge;
  # they show how far the import and the suite get on each OS so the
  # remaining portability work is visible in every PR.
  cross-platform-smoke:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Import smoke
        run: python -c "import polyglot_ai.app, polyglot_ai.ui.main_window; print('import ok')"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q -p no:cacheprovider

  build-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Verify wheel
        run: |
          pip install -c constraints.txt dist/*.whl
          python -c "from polyglot_ai import __version__; print(f'Version: {__version__}')"

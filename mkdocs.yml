site_name: Polyglot AI
site_description: AI-powered multi-provider coding assistant for Linux
site_url: https://sabiut.github.io/polyglot-ai/
repo_url: https://github.com/sabiut/polyglot-ai
repo_name: sabiut/polyglot-ai

# Hide the theme's "Made with Material for MkDocs" footer notice.
extra:
  generator: false

# Pages are generated from wiki/ by scripts/gen_docs.py — run it
# before `mkdocs build` (the docs workflow does this automatically).
docs_dir: docs_build

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: Getting-Started.md
  - Chat: Chat.md
  - Editor, Terminal & Files: Editor-Terminal-Files.md
  - Tasks & Today: Tasks-and-Today.md
  - Git & PRs: Git-and-PR.md
  - Tests & Review: Tests-and-Review.md
  - CI, Docker & Kubernetes: CI-Docker-Kubernetes.md
  - Database: Database.md
  - MCP Servers: MCP-Servers.md
  - Settings & Shortcuts: Settings-and-Shortcuts.md
  - Troubleshooting & FAQ: Troubleshooting-FAQ.md
